[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[project.scripts]
satyrn-pi = "satyrn_pi.cli:run"

[project]
name = "satyrn-pi"
version = "0.1.0"
description = "Measurement CLI for Satyrn Pi: a small local model as a bounded coding worker inside Pi."
license = "MIT"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "zensical",
  "zensical-glossary",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
